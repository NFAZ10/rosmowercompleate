services:
  rosmower:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rosmower:latest
    container_name: rosmower_robot
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      # Mount USB devices and device paths
      - /dev:/dev
      # Mount udev rules for device persistence
      - /run/udev:/run/udev:ro
      # Optional: mount external config or logs
      - ./logs:/ws/logs
      # For GUI applications
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    # Device mappings for specific hardware
    devices:
      - /dev/ttyACM0:/dev/ttyACM0  # MAVROS FCU
      - /dev/ttyUSB0:/dev/ttyUSB0  # Backup for serial devices
    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /ws/install/setup.bash &&
      ros2 launch rosmower launch_robot.launch.py
      "

  # Optional: RViz for visualization (run separately)
  rviz:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rosmower:latest
    container_name: rosmower_rviz
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./rviz_configs:/root
    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /ws/install/setup.bash &&
      rviz2
      "
    profiles:
      - gui

  # Optional: Development container with full access
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rosmower:latest
    container_name: rosmower_dev
    privileged: true
    network_mode: host
    volumes:
      - .:/ws_dev
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    working_dir: /ws_dev
    command: bash
    profiles:
      - dev