mqtt_bridge:
  ros__parameters:
    # MQTT Broker Configuration
    mqtt_broker: "localhost"  # Change to your MQTT broker address
    mqtt_port: 1883
    mqtt_username: ""  # Optional
    mqtt_password: ""  # Optional
    mqtt_client_id: "rosmower_mqtt_bridge"
    mqtt_keepalive: 60
    
    # Base MQTT topic prefix
    base_topic: "rosmower"
