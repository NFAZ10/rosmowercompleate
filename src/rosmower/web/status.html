<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS Mower - Node Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .back-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .status-card h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }
        
        .node-list {
            list-style: none;
        }
        
        .node-item {
            padding: 10px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
        }
        
        .node-item:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: translateX(5px);
        }
        
        .node-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }
        
        .node-status.running {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
            animation: pulse 2s infinite;
        }
        
        .node-status.stopped {
            background: #f44336;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .node-name {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .refresh-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        .start-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2196F3;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .start-btn:hover {
            background: #0b7dda;
            transform: translateY(-2px);
        }
        
        .button-group {
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #f44336;
        }
        
        .system-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .info-item {
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        
        .info-label {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .last-update {
            text-align: center;
            margin-top: 10px;
            opacity: 0.7;
            font-size: 0.9em;
        }
        
        .topic-count {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Node Status Monitor</h1>
            <a href="/" class="back-btn" target="_blank">🎮 Open Control Panel</a>
        </div>
        
        <div class="button-group">
            <button class="refresh-btn" onclick="refreshStatus()">🔄 Refresh Status</button>
            <button class="start-btn" onclick="startContainer()" id="start-btn" style="display:none">🚀 Start Container</button>
        </div>
        
        <div id="status-container">
            <div class="loading">Loading node status...</div>
        </div>
        
        <div class="last-update" id="last-update"></div>
    </div>
    
    <script>
        let autoRefreshInterval;
        
        async function refreshStatus() {
            const container = document.getElementById('status-container');
            
            try {
                const response = await fetch('/api/ros/nodes');
                const data = await response.json();
                
                if (data.error) {
                    container.innerHTML = `
                        <div class="error">
                            ⚠️ ${data.error}<br><br>
                            The Docker container needs to be running to see node status.<br>
                            Click the "Start Container" button or run: <code>docker start rosmower_robot</code>
                        </div>
                    `;
                    document.getElementById('start-btn').style.display = 'inline-block';
                    return;
                }
                
                document.getElementById('start-btn').style.display = 'none';
                
                let html = '<div class="status-grid">';
                
                // System Status Card
                html += `
                    <div class="status-card">
                        <h3>System Status</h3>
                        <div class="system-info">
                            <div class="info-item">
                                <div class="info-label">Container</div>
                                <div class="info-value">
                                    <span class="node-status ${data.container_running ? 'running' : 'stopped'}"></span>
                                    ${data.container_running ? 'Running' : 'Stopped'}
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Total Nodes</div>
                                <div class="info-value">${data.nodes ? data.nodes.length : 0}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Total Topics</div>
                                <div class="info-value">${data.topics ? data.topics.length : 0}</div>
                            </div>
                        </div>
                    </div>
                `;
                
                // Nodes Card
                if (data.nodes && data.nodes.length > 0) {
                    html += `
                        <div class="status-card">
                            <h3>ROS Nodes <span class="topic-count">${data.nodes.length}</span></h3>
                            <ul class="node-list">
                    `;
                    
                    data.nodes.sort().forEach(node => {
                        html += `
                            <li class="node-item">
                                <span class="node-status running"></span>
                                <span class="node-name">${node}</span>
                            </li>
                        `;
                    });
                    
                    html += '</ul></div>';
                } else if (data.container_running) {
                    html += `
                        <div class="status-card">
                            <h3>ROS Nodes</h3>
                            <div class="error">No nodes detected</div>
                        </div>
                    `;
                }
                
                // Topics Card
                if (data.topics && data.topics.length > 0) {
                    html += `
                        <div class="status-card">
                            <h3>Active Topics <span class="topic-count">${data.topics.length}</span></h3>
                            <ul class="node-list">
                    `;
                    
                    // Show first 10 topics
                    data.topics.slice(0, 10).forEach(topic => {
                        html += `
                            <li class="node-item">
                                <span class="node-status running"></span>
                                <span class="node-name">${topic}</span>
                            </li>
                        `;
                    });
                    
                    if (data.topics.length > 10) {
                        html += `
                            <li class="node-item">
                                <span class="node-name" style="font-style: italic; opacity: 0.7;">
                                    ... and ${data.topics.length - 10} more topics
                                </span>
                            </li>
                        `;
                    }
                    
                    html += '</ul></div>';
                }
                
                html += '</div>';
                container.innerHTML = html;
                
                // Update last update time and the web server is accessible.
                    </div>
                `;
                document.getElementById('start-btn').style.display = 'inline-block';
            }
        }
        
        async function startContainer() {
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = '⏳ Starting...';
            
            try {
                const response = await fetch('/api/docker/start');
                const data = await response.json();
                
                if (data.status === 'success') {
                    btn.textContent = '✅ Started!';
                    setTimeout(() => {
                        btn.style.display = 'none';
                        refreshStatus();
                    }, 2000);
                } else {
                    btn.textContent = '❌ Failed to start';
                    btn.disabled = false;
                    alert('Failed to start container: ' + data.output);
                }
            } catch (error) {
                btn.textContent = '❌ Error';
                btn.disabled = false;
                alert('Error starting container: ' + error.message)ocument.getElementById('last-update').textContent = 
                    `Last updated: ${now.toLocaleTimeString()}`;
                
            } catch (error) {
                container.innerHTML = `
                    <div class="error">
                        Failed to fetch node status: ${error.message}<br>
                        Make sure the Docker container is running.
                    </div>
                `;
            }
        }
        
        // Initial load
        refreshStatus();
        
        // Auto-refresh every 5 seconds
        autoRefreshInterval = setInterval(refreshStatus, 5000);
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
