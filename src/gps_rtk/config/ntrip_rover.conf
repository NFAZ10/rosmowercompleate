# RTKLIB 2.4.3 Rover Configuration with NTRIP Base Corrections
# Numeric enum values only - no string constants
# NTRIP Server: 10.0.213.211
# Mount Point: BASE
# Username: nfazio
# Password: 123456789

# Input streams
# inpstr1-type: 0=off 1=serial 2=file 3=tcpsvr 4=tcpcli 5=ntripcli
inpstr1-type       =1
# inpstr1-format: 0=rtcm2 1=rtcm3 2=oem4 3=oem3 4=ubx 5=ss2 15=sp3
inpstr1-format     =3
inpstr1-path       =/dev/ttyTHS1:115200:8:n:1:off

# Base corrections via NTRIP
# inpstr2-type: 0=off 1=serial 2=file 3=tcpsvr 4=tcpcli 5=ntripcli
inpstr2-type       =5
# inpstr2-format: 0=rtcm2 1=rtcm3 2=oem4 3=oem3 4=ubx 5=ss2 15=sp3
inpstr2-format     =1
inpstr2-path       =ntrip://nfazio:123456789@10.0.212.119:2101/BASE

inpstr3-type       =0

# Output streams
# outstr1-type: 0=off 1=serial 2=file 3=tcpsvr 4=tcpcli 5=ntripcli
outstr1-type       =3
# outstr1-format: 0=llh 1=xyz 2=enu 3=nmea
outstr1-format     =3
outstr1-path       =:9001

outstr2-type       =0

# Log streams
logstr1-type       =0
logstr2-type       =0
logstr3-type       =0

# Positioning mode
# pos1-posmode: 0=single 1=dgps 2=kinematic 3=static 4=movingbase 5=fixed 6=ppp-kine 7=ppp-static
pos1-posmode       =2

# Frequencies
# pos1-frequency: 1=l1 2=l1+l2 3=l1+l2+l5 4=l1+l2+l5+l6 5=l1+l5
pos1-frequency     =3

# Solution type: 0=forward 1=backward 2=combined
pos1-soltype       =0

# Elevation mask (degrees)
pos1-elmask        =15

# SNR mask (dBHz)
pos1-snrmask_r     =0
pos1-snrmask_b     =0
pos1-snrmask_L1    =0
pos1-snrmask_L2    =0
pos1-snrmask_L5    =0

# Dynamics model: 0=off 1=on
pos1-dynamics      =0

# Tide correction: 0=off 1=solid 2=solid+otl 3=otl
pos1-tidecorr      =0

# Ionosphere correction: 0=off 1=broadcast 2=sbas 3=dual-freq 4=est-stec 5=ionex-tec 6=qzs-brdc
pos1-ionoopt       =3

# Troposphere correction: 0=off 1=saas 2=sbas 3=est-ztd 4=est-ztdgrad
pos1-tropopt       =1

# Satellite ephemeris: 0=broadcast 1=precise 2=broadcast+sbas 3=broadcast+ssrapc 4=broadcast+ssrcom
pos1-sateph        =0

# Ambiguity resolution mode
# pos1-armode: 0=off 1=continuous 2=instantaneous 3=fix-and-hold
pos1-armode        =3

# GLONASS AR mode: 0=off 1=on 2=autocal
pos1-gloarmode     =1

# GPS AR: 0=off 1=on
pos1-bdsarmode     =1

# AR filtering: 0=off 1=on
pos1-arfilter      =1

# Outage count limit for reset
pos1-maxout        =5

# Min lock count for AR
pos1-minlock       =0

# Min fix count for hold
pos1-minfixsats    =4

# Min elevation for AR (deg)
pos1-minholdsats   =5

# Min dropout time for AR reset (s)
pos1-mindropsats   =10

# Max age of differential (s)
pos1-maxage        =30

# Slip threshold cycle
pos1-maxslipcyc    =20

# Reject threshold (m)
pos1-rejionno      =30
pos1-rejgdop       =30

# Number of iteration for position
pos1-niter         =1

# Baseline length constraint: 0=off
pos1-baselen       =0
pos1-basesig       =0

# Antenna positions
ant1-postype       =0
ant1-pos1          =0
ant1-pos2          =0
ant1-pos3          =0

ant2-postype       =0
ant2-pos1          =0
ant2-pos2          =0
ant2-pos3          =0

# Misc settings
misc-timeinterp    =1
misc-sbasatsel     =0
misc-rnxopt1       =
misc-rnxopt2       =

# File paths (not used in this config)
file-satantfile    =
file-rcvantfile    =
file-staposfile    =
file-geoidfile     =
file-ionofile      =
file-dcbfile       =
file-eopfile       =
file-blqfile       =
file-tempdir       =
file-geexefile     =
file-solstatfile   =
file-tracefile     =
