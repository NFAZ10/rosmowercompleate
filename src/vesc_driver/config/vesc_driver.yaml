# VESC Driver Configuration
# For autonomous mower with dual VESC 6.7 controllers

# Serial connection to primary VESC (ID 0)
serial_port: "/dev/serial/by-id/usb-STMicroelectronics_ChibiOS_RT_Virtual_COM_Port_304-if00"  # Adjust based on your USB port
baudrate: 115200

# Robot geometry (adjust to your actual measurements)
wheel_radius: 0.1091  # meters (27 inch circumference = 8.59 inch diameter)
wheel_separation: 0.52  # meters (520mm between wheel centers)

# Motor configuration
pole_pairs: 15  # Hoverboard BLDC motors typically have 15 pole pairs
max_rpm: 3000  # Maximum ERPM (electrical RPM) safety limit

# VESC CAN IDs
left_vesc_can_id: 0   # VESC ID 0 (connected via USB)
right_vesc_can_id: 47  # VESC ID 1 (connected via CAN bus)

# Control loop rates
control_rate: 50.0     # Hz - cmd_vel processing rate
telemetry_rate: 10.0   # Hz - VESC telemetry request rate

# Odometry
publish_odom: true
odom_frame_id: "odom"
base_frame_id: "base_link"
